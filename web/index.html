<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lelievlet 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f4f7f9; }
    #app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- De ontwikkelpagina: één viewer die het hele venster vult. De viewer vult altijd het element
       waarin hij wordt gezet, dus dat element moet een hoogte hebben. -->
  <div id="app"></div>

  <script type="module">
    import Lelievlet from '/src/lib.js';

    // the viewer fills the page, which never scrolls: once the keyboard is put away after typing in a
    // field, the page is put back where it was - a phone may have moved it to keep the field in view
    addEventListener('focusout', () => setTimeout(() => { if (scrollX || scrollY) scrollTo(0, 0); }, 100));

    Lelievlet.create(document.getElementById('app'), {
      // assets: '/',                                    // standaard: naast het script (dev: de serverroot)
      // aanpassen: { zeilnummer: '442', naam: 'Fluessen', plaats: 'Zwolle' },
      // namen: { onderdelen: { hommerring: 'Mastring' } },
      // quiz: { niveau: 2, weg: ['Kleed'] },
      // de hulpmiddelen staan aan onder `pnpm dev`, niet in een build; de BPR-galerij moet je apart noemen
      debug: import.meta.env.DEV && { modelnummer: true, quiztabellen: true, toestand: true, bpr: true },
    });
  </script>
</body>
</html>
